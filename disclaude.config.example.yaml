# Runtime → named LLM. /agent use <name> starts a new session in the current chat.
agents:
  daily:
    backend: codex
    llm: daily
    default: true
    codex:
      transport: app-server
  assistant:
    backend: claude
    llm: assistant
  # Optional DSH runtime; its API connection belongs in the named LLM below.
  # dsh:
  #   backend: dsh
  #   llm: glm-openai
  #   mode: minimal
  #   dshHome: /absolute/path/to/isolated-dsh-home

# Every bound LLM requires an explicit model, including native Codex.
# Codex uses the CLI's account; no API block is needed.
llms:
  # glm-openai:
  #   model: glm-5.3
  #   api:
  #     protocol: openai
  #     baseUrl: https://your-openai-compatible-api.example/v1
  #     apiKey: $GLM_API_KEY
  daily:
    model: gpt-6-luna
    reasoningEffort: max
    maxConcurrentSessions: 3 # Shared by agents bound to this LLM
  assistant:
    model: sonnet
    api:
      protocol: anthropic # anthropic or openai (Pi and DSH support both)
      apiKey: $ASSISTANT_API_KEY # $NAME or ${NAME}, from the service environment
      # baseUrl: https://your-api.example # Omit for the protocol's default endpoint
    # Native Claude aliases; use actual model IDs exposed by your endpoint.
    # env:
    #   ANTHROPIC_DEFAULT_OPUS_MODEL: your-opus-model
    #   ANTHROPIC_DEFAULT_SONNET_MODEL: your-sonnet-model
    #   ANTHROPIC_DEFAULT_HAIKU_MODEL: your-haiku-model
    # Gateway model Claude Code does not know: pin the catalog entry (window,
    # capabilities, effort defaults) it should inherit. Opus-line IDs are the
    # only 1M-context keys; requires Claude Code >= v2.1.200 (Issue #5410).
    # behavesAs: claude-opus-5
    # Or a raw multi-slot map (mutually exclusive with behavesAs):
    # modelOverrides:
    #   claude-opus-5: kimi-k3
    #   claude-sonnet-4-5: kimi-k3-flash

channels:
  # Personal WeChat via Tencent iLink. First run: disclaude wechat login
  wechat:
    enabled: false
    # Optional absolute path, same as login --state-dir; default ~/.disclaude/wechat
    # stateDir: /absolute/path/to/private/wechat-account
    # For multiple WeChat logins, replace singleton stateDir with named accounts:
    # accounts:
    #   work:
    #     enabled: true
    #     stateDir: /absolute/path/to/private/wechat-work
    #   personal:
    #     enabled: true
    #     stateDir: /absolute/path/to/private/wechat-personal
  feishu:
    enabled: true
    appId: $FEISHU_APP_ID
    appSecret: $FEISHU_APP_SECRET
    streamingCard: false
  rest:
    enabled: false
    host: 127.0.0.1
    port: 3000
    fileStorageDir: ./data/rest-files
    # Optional bearer protection for all REST channel routes except health:
    # authToken: $REST_CHANNEL_AUTH_TOKEN

workspace:
  dir: ./workspace

# One-click GitHub issue reporting (Issue #5400). Optional; when absent the
# /issue entry reports that reporting is not configured. The App needs read/write
# access to issues on the repository. privateKey is a secret: it must reference
# the service environment (PEM content; literal or \n-escaped newlines).
# github:
#   repository: hs3180/disclaude
#   appId: "12345678"
#   installationId: "234567890"
#   privateKey: $GITHUB_APP_PRIVATE_KEY

logging:
  level: info
  pretty: true
  sdkDebug: false

sessionRestore:
  historyDays: 7
  maxContextLength: 4000
  sessionTimeout:
    enabled: false
    idleMinutes: 30
    maxSessions: 100
    checkIntervalMinutes: 5

# Full settings and migration: docs/agent-configuration.md
