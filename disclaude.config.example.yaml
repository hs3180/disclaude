# Runtime → named LLM. /agent use <name> starts a new session in the current chat.
agents:
  daily:
    backend: codex
    llm: daily
    default: true
    codex:
      transport: app-server
  assistant:
    backend: claude
    llm: assistant
  # Optional native DSH runtime; choose a model supported by your DSH profile.
  # dsh:
  #   backend: dsh
  #   llm: dsh-model
  #   mode: minimal
  #   dshHome: /absolute/path/to/isolated-dsh-home

# Native Codex binds agent + LLM through the CLI's account; no API block is needed.
llms:
  # dsh-model:
  #   model: your-supported-model
  daily:
    model: gpt-6-luna
    reasoningEffort: max
    maxConcurrentSessions: 3             # Shared by agents bound to this LLM
  assistant:
    model: sonnet
    api:
      protocol: anthropic                 # anthropic or openai (Pi supports both)
      apiKey: $ASSISTANT_API_KEY         # $NAME or ${NAME}, from the service environment
      # baseUrl: https://your-api.example # Omit for the protocol's default endpoint
    # Native Claude aliases; use actual model IDs exposed by your endpoint.
    # env:
    #   ANTHROPIC_DEFAULT_OPUS_MODEL: your-opus-model
    #   ANTHROPIC_DEFAULT_SONNET_MODEL: your-sonnet-model
    #   ANTHROPIC_DEFAULT_HAIKU_MODEL: your-haiku-model

channels:
  feishu:
    enabled: true
    appId: your_feishu_app_id
    appSecretEnv: FEISHU_APP_SECRET
    streamingCard: false
  rest:
    enabled: false
    host: 127.0.0.1
    port: 3000
    fileStorageDir: ./data/rest-files

workspace:
  dir: ./workspace

logging:
  level: info
  pretty: true
  sdkDebug: false

sessionRestore:
  historyDays: 7
  maxContextLength: 4000
  sessionTimeout:
    enabled: false
    idleMinutes: 30
    maxSessions: 100
    checkIntervalMinutes: 5

# Full settings and migration: docs/agent-configuration.md
