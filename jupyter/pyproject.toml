[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disclaude-jupyter"
version = "0.1.0"
description = "Shared Notebook document and execution coordination for disclaude"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab==4.6.3",
  "jupyter-collaboration==5.0.4",
  "jupyter-docprovider==3.0.4",
  "ipykernel==7.4.0",
  "jupyter-server==2.21.1",
  "jupyter-server-ydoc==3.0.4",
  "jupyter-server-nbmodel==0.2.9",
  "jupyter-ydoc==4.1.1",
  "pycrdt==0.14.8",
  "jupyter-client==8.10.0",
  "nbformat==5.11.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "httpx-ws==0.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["disclaude_jupyter*"]
