[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disclaude-jupyter"
version = "0.1.0"
description = "Shared Notebook document and execution coordination for disclaude"
requires-python = ">=3.11"
dependencies = [
  "jupyter-server>=2.19.0,<2.22",
  "jupyter-server-ydoc>=2.4.1,<3.1",
  "jupyter-server-nbmodel>=0.1.1a4,<0.3",
  "jupyter-ydoc>=3.5.0,<4.2",
  "pycrdt>=0.13.1,<0.15",
  "jupyter-client>=8.8.0,<8.11",
  "ipykernel>=7.2.0,<7.5",
  "nbformat>=5.10.4,<5.12",
]

[project.optional-dependencies]
managed = [
  "jupyterlab==4.6.3", "jupyter-collaboration==5.0.4",
  "jupyter-docprovider==3.0.4", "ipykernel==7.4.0",
  "jupyter-server==2.21.1", "jupyter-server-ydoc==3.0.4",
  "jupyter-server-nbmodel==0.2.9", "jupyter-ydoc==4.1.1",
  "pycrdt==0.14.8", "jupyter-client==8.10.0", "nbformat==5.11.1",
]
configured-20261003 = [
  "jupyterlab==4.4.1", "jupyter-collaboration==4.4.1",
  "jupyter-docprovider==2.4.1", "ipykernel==7.2.0",
  "jupyter-server==2.19.0", "jupyter-server-ydoc==2.4.1",
  "jupyter-server-nbmodel==0.1.1a4", "jupyter-ydoc==3.5.0",
  "pycrdt==0.13.1", "jupyter-client==8.8.0", "nbformat==5.10.4",
]
test = ["httpx==0.28.1", "httpx-ws==0.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["disclaude_jupyter*"]
