# Maintainer: copy to .github/workflows/package-install.yml to enable.
# Existing CI npm test already runs the remote gate on Linux / Node 20.
name: Git package installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
        npm: ['10', '11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@${{ matrix.npm }}
      - run: npm ci --include=dev
      - name: Verify source and install remote Git candidate
        run: |
          npm run build
          node scripts/verify-git-candidate.mjs
          DISClAUDE_TEST_GIT_INSTALL=1 npx vitest run tests/git-release-install.test.ts
