name: Docker Service E2E (manual)
# Container acceptance is opt-in; ordinary PR/push checks do not require Docker.
on:
  workflow_dispatch:
jobs:
  acceptance:
    name: Service image lifecycle and persisted data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the actual production service image
        run: docker build --progress=plain -f Dockerfile.service -t disclaude-service:e2e .
      - name: Install test runner
        run: pnpm install --frozen-lockfile
      - name: Run container startup, channel storage and recreation use case
        env:
          DISCLAUDE_E2E_DOCKER_IMAGE: disclaude-service:e2e
          DISCLAUDE_E2E_DOCKER_CLEANUP_IMAGE: disclaude-service:e2e
        run: node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/e2e/docker-service.test.ts tests/e2e/docker-cleanup.test.ts
      - name: Verify cleanup after an injected service test failure
        env:
          DISCLAUDE_E2E_DOCKER_IMAGE: disclaude-service:e2e
          DISCLAUDE_E2E_DOCKER_FAIL_AFTER_START: '1'
        run: |
          set +e
          # This subprocess must fail; only the verifier below decides the job result.
          # Avoid GitHub failure annotations for the deliberately injected error.
          node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/e2e/docker-service.test.ts --reporter=default > docker-failure-cleanup.log 2>&1
          result=$?
          set -e
          cat docker-failure-cleanup.log
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const log = readFileSync('docker-failure-cleanup.log', 'utf8');
          assert(log.includes('Injected Docker E2E failure after owned container start'));
          assert(log.includes('DOCKER_TEST_CLEANUP'));
          console.log('PASS: injected failure returned exit 1 and owned Docker resources were cleaned.');
          JS
