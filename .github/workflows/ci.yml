name: CI

on:
  push:
    branches: [main, master]
  # Stacked PRs need the same checks before their prerequisite merges.
  pull_request:

jobs:
  # =============================================================================
  # Lint and Type Check
  # =============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Verify isolated test cleanup and interruption
        run: node --test scripts/run-isolated-test.test.mjs

  # =============================================================================
  # Unit Tests
  # =============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # =============================================================================
  # Build
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache packages build
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/.tsbuildinfo
          key: packages-${{ runner.os }}-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json') }}
          restore-keys: |
            packages-${{ runner.os }}-

      - name: Build packages
        run: npm run build:packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 7

  # =============================================================================
  # Test Coverage Report
  # =============================================================================
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Browser changes get real Linux/amd64 runtime evidence, not only YAML tests.
  chromium-container:
    name: Chromium Container Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect browser container changes
        id: changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(docker/|docker-compose\.yml$|scripts/test-chromium-container\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Build browser image
        if: steps.changes.outputs.run == 'true'
        run: docker build -t disclaude-chromium:060-test -f docker/Dockerfile.chromium docker
      - name: Test CDP, display, persistence and failure lifecycle
        if: steps.changes.outputs.run == 'true'
        run: node scripts/test-chromium-container.mjs disclaude-chromium:060-test
