name: Jupyter patch CLI

on:
  pull_request:
    paths:
      - 'jupyter/datalayer/**'
      - 'jupyter/probes/**'
      - 'bin/disclaude.js'
      - 'bin/jupyter-patch.js'
      - 'bin/jupyter-terminal.js'
      - 'bin/jupyter-auth.js'
      - 'bin/jupyter-test.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-git-release.mjs'
      - 'scripts/test-checkout-install.mjs'
      - 'scripts/test-package-install.mjs'
      - 'tests/jupyter/datalayer-package-test.py'
      - 'tests/jupyter/patch-cli-test.mjs'
      - 'tests/jupyter/test-cli-test.mjs'
      - 'tests/jupyter/auth-input-test.mjs'
      - 'tests/jupyter/auth-tty-test.py'
      - '.github/workflows/datalayer-package.yml'
  push:
    branches: [main]
    paths:
      - 'jupyter/datalayer/**'
      - 'jupyter/probes/**'
      - 'bin/disclaude.js'
      - 'bin/jupyter-patch.js'
      - 'bin/jupyter-terminal.js'
      - 'bin/jupyter-auth.js'
      - 'bin/jupyter-test.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-git-release.mjs'
      - 'scripts/test-checkout-install.mjs'
      - 'scripts/test-package-install.mjs'
      - 'tests/jupyter/datalayer-package-test.py'
      - 'tests/jupyter/patch-cli-test.mjs'
      - 'tests/jupyter/test-cli-test.mjs'
      - 'tests/jupyter/auth-input-test.mjs'
      - 'tests/jupyter/auth-tty-test.py'
      - '.github/workflows/datalayer-package.yml'

jobs:
  package:
    name: Jupyter patch CLI (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    # Pinned: ubuntu-latest has rolled to 26.04, whose actions/setup-python
    # toolcache no longer provides Python 3.9 (needed by the Node18/Py3.9
    # compatibility leg). ubuntu-24.04 keeps that support matrix intact.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { node: '18', python: '3.9' }
          - { node: '24', python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies for the host .env parser
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify CLI generation, authentication and Terminal-only transport
        run: node --test tests/jupyter/patch-cli-test.mjs tests/jupyter/auth-input-test.mjs tests/jupyter/test-cli-test.mjs
      - name: Verify artifact integrity, file rollback and activation reporting
        run: python tests/jupyter/datalayer-package-test.py -v
      - name: Verify hidden authentication in a real terminal
        run: python tests/jupyter/auth-tty-test.py -v
