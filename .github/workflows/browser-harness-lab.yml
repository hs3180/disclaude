name: Browser Harness IPC Lab
on:
  pull_request:
    paths:
      - 'tests/e2e/browser-service.test.ts'
      - 'bin/disclaude.js'
      - 'packages/service/src/service/**'
      - 'package*.json'
      - 'packages/*/package.json'
      - 'experiments/browser-control/**'
      - 'packages/service/src/browser-control/**'
      - 'packages/core/src/utils/**'
      - 'packages/core/src/sdk/providers/**'
      - '.github/workflows/browser-harness-lab.yml'
  push:
    branches: [main, master]
    paths:
      - 'tests/e2e/browser-service.test.ts'
      - 'bin/disclaude.js'
      - 'packages/service/src/service/**'
      - 'package*.json'
      - 'packages/*/package.json'
      - 'experiments/browser-control/**'
      - 'packages/service/src/browser-control/**'
      - 'packages/core/src/utils/**'
      - 'packages/core/src/sdk/providers/**'
      - '.github/workflows/browser-harness-lab.yml'
jobs:
  acceptance:
    name: Real harness ownership and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build PR SDK for injection regression
        run: npm ci --include=dev && npm run build
      - name: Build pinned browser-use acceptance image
        run: docker build -t disclaude-browser-harness-lab -f experiments/browser-control/Dockerfile .
      - name: Run real Chromium and harness over IPC
        run: |
          mkdir -p "$RUNNER_TEMP/browser-harness-evidence"
          docker run --rm --init --shm-size=2g --memory=4g \
            -e DISCLAUDE_BROWSER_SDK_MODULE=file:///sdk/utils/sdk.js \
            -v "$GITHUB_WORKSPACE/packages/core/dist:/sdk:ro" \
            -v "$RUNNER_TEMP/browser-harness-evidence:/evidence" \
            disclaude-browser-harness-lab
      - name: Run Linux product CLI lifecycle and shared-browser E2E
        run: |
          docker run --rm --init --shm-size=2g --memory=4g \
            -v "$GITHUB_WORKSPACE:/product" -w /product \
            --entrypoint /bin/bash disclaude-browser-harness-lab -lc '
              set -euo pipefail
              export DISCLAUDE_E2E_BROWSER_PYTHON=/opt/browser-env/bin/python
              export DISCLAUDE_E2E_CHROMIUM="$(find /ms-playwright -path "*/chrome-linux*/chrome" -type f -print -quit)"
              test -n "$DISCLAUDE_E2E_CHROMIUM"
              test -x "$DISCLAUDE_E2E_CHROMIUM"
              node node_modules/vitest/vitest.mjs run tests/e2e/browser-service.test.ts
            '
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-harness-ipc-evidence
          path: ${{ runner.temp }}/browser-harness-evidence
          if-no-files-found: ignore
