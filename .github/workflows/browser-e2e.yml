name: Browser Coordination E2E
on:
  pull_request:
    paths:
      - 'vitest*.config.ts'
      - 'tests/setup.ts'
      - 'tests/e2e/browser-service.test.ts'
      - 'tests/e2e/browser-migration.test.ts'
      - 'scripts/test-browser-contention.mjs'
      - 'tests/e2e/helpers/browser-*.ts'
      - 'tests/e2e/browser-doctor.test.ts'
      - 'tests/e2e/browser-smoke.test.ts'
      - 'scripts/browser-use-smoke*'
      - 'bin/disclaude.js'
      - 'packages/service/src/cli-main.ts'
      - 'packages/service/src/service.ts'
      - 'package*.json'
      - 'packages/*/package.json'
      - 'packages/service/src/browser-control/**'
      - 'packages/core/src/utils/**'
      - 'packages/core/src/sdk/providers/**'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main, master]
    paths:
      - 'vitest*.config.ts'
      - 'tests/setup.ts'
      - 'tests/e2e/browser-service.test.ts'
      - 'tests/e2e/browser-migration.test.ts'
      - 'scripts/test-browser-contention.mjs'
      - 'tests/e2e/helpers/browser-*.ts'
      - 'tests/e2e/browser-doctor.test.ts'
      - 'tests/e2e/browser-smoke.test.ts'
      - 'scripts/browser-use-smoke*'
      - 'bin/disclaude.js'
      - 'packages/service/src/cli-main.ts'
      - 'packages/service/src/service.ts'
      - 'package*.json'
      - 'packages/*/package.json'
      - 'packages/service/src/browser-control/**'
      - 'packages/core/src/utils/**'
      - 'packages/core/src/sdk/providers/**'
      - '.github/workflows/browser-e2e.yml'
jobs:
  acceptance:
    name: Product browser lifecycle and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build product
        run: npm ci --include=dev && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser dependencies
        run: |
          python -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install 'browser-use==0.13.10' 'browser-harness==0.1.13'
      - name: Run product CLI lifecycle and shared-browser E2E
        env:
          DISCLAUDE_E2E_BROWSER_STRESS: '1'
        run: |
          export DISCLAUDE_E2E_BROWSER_PYTHON="$RUNNER_TEMP/browser-env/bin/python"
          export DISCLAUDE_E2E_CHROMIUM="$(command -v google-chrome)"
          test -x "$DISCLAUDE_E2E_CHROMIUM"
          "$DISCLAUDE_E2E_CHROMIUM" --version
          node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/e2e/browser-service.test.ts tests/e2e/browser-doctor.test.ts tests/e2e/browser-smoke.test.ts

  migration:
    name: Legacy browser IPC migration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build product
        run: npm ci --include=dev && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser dependencies
        run: |
          python -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install 'browser-use==0.13.10' 'browser-harness==0.1.13'
      - name: Install Chrome on macOS
        if: runner.os == 'macOS'
        run: |
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            brew install --cask google-chrome
          fi
      - name: Prepare native service manager
        run: |
          if [ '${{ runner.os }}' = Linux ]; then
            sudo systemctl start "user@$(id -u).service"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
            systemctl --user show-environment >/dev/null
          else
            launchctl print "gui/$(id -u)" >/dev/null
          fi
      - name: Run real legacy-to-main-service migration E2E
        env:
          DISCLAUDE_E2E_BROWSER_MIGRATION: '1'
          DISCLAUDE_E2E_BROWSER_PYTHON: ${{ runner.temp }}/browser-env/bin/python
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            export DISCLAUDE_E2E_CHROMIUM='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          else
            export DISCLAUDE_E2E_CHROMIUM="$(command -v google-chrome)"
          fi
          test -x "$DISCLAUDE_E2E_CHROMIUM"
          "$DISCLAUDE_E2E_CHROMIUM" --version
          node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/e2e/browser-migration.test.ts
