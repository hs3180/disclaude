# Compatibility override for existing operator commands.
# Headed VNC/noVNC is now enabled in docker-compose.yml without an overlay.
services:
  chromium:
    environment:
      CHROMIUM_VNC_ENABLED: "1"
      CHROMIUM_VNC_PASSWORD: "${CHROMIUM_VNC_PASSWORD:-}"
    ports:
      - "${CHROMIUM_VNC_BIND:-0.0.0.0}:${CHROMIUM_VNC_HOST_PORT:-6080}:6080"
